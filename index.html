<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የወረዳ የሥራ አፈጻጸም ሪፖርት ማቀበያ</title>
    <!-- Tailwind CSS for modern design -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800">

    <div class="max-w-md mx-auto min-h-screen bg-white shadow-xl flex flex-col">
        <!-- Header -->
        <header class="bg-blue-900 text-white p-4 text-center shadow-md">
            <h1 class="text-lg font-bold">የምስራቅ ሸዋ ዞን / ቢቡኝ ወረዳ</h1>
            <p class="text-xs text-blue-200 mt-1">የፖለቲካ እና አቅም ግንባታ ክንፍ ፅ/ቤት</p>
        </header>

        <!-- Main Content Area -->
        <main class="p-4 flex-1">

            <!-- Tab Switcher -->
            <div class="flex border-b mb-4 text-sm font-medium">
                <button onclick="switchTab('institution')" id="btn-institution" class="flex-1 py-2 text-center border-b-2 border-blue-600 text-blue-600 font-bold">ለተቋማት (ሪፖርት መላኪያ)</button>
                <button onclick="requestAdminAccess()" id="btn-admin" class="flex-1 py-2 text-center text-slate-500 hover:text-blue-600">ለአድሚን (መቆጣጠሪያ)</button>
            </div>

            <!-- 1. Institution Form View -->
            <div id="view-institution" class="space-y-4">
                <div class="bg-blue-50 p-3 rounded-lg text-xs text-blue-800">
                    <p class="font-bold">⚠️ የሪፖርት ማቀረቢያ ሰዓት:</p>
                    <p>ከሰዓት በኋላ ከ06:30 እስከ 08:00 ሰዓት ብቻ ነው:: ከዚህ ውጪ የሚላኩ ሪፖርቶች ዘግይተዋል ተብሎ ይመዝገቡል::</p>
                </div>

                <form id="reportForm" onsubmit="submitReport(event)" class="space-y-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">ተቋም ይመረጡ (29 ተቋማት)</label>
                        <select id="instName" required class="w-full p-2.5 text-sm border rounded-lg focus:ring-1 focus:ring-blue-500">
                            <option value="">-- ተቋም ይመረጡ --</option>
                            <option value="1. ከልየው አስረስ ዘውዴ 2ኛ ደረጃ ት/ቤት/1. ከልየው አስረስ ዘውዴ 2ኛ ደረጃ ት/ቤት">1. ከልየው አስረስ ዘውዴ 2ኛ ደረጃ ት/ቤት</option>
                            <option value="2. ድጎ ፅዮን 1ኛ ደረጃ ት/ቤት/2. ድጎ ፅዮን 1ኛ ደረጃ ት/ቤት">2. ድጎ ፅዮን 1ኛ ደረጃ ት/ቤት</option>
                            <option value="3. መሃል ሰላም አንደኛ እና ሁለተኛ ደረጃ ት/ቤት/3. መሃል ሰላም አንደኛ እና ሁለተኛ ደረጃ ት/ቤት">3. መሃል ሰላም አንደኛ እና ሁለተኛ ደረጃ ት/ቤት</option>
                            <option value="4. ወለቀ 1ኛ ደረጃ ት/ቤት/4. ወለቀ 1ኛ ደረጃ ት/ቤት">4. ወለቀ 1ኛ ደረጃ ት/ቤት</option>
                            <option value="5. ጠጅቱ 1st/5. ጠጅቱ 1st">5. ጠጅቱ 1st</option>
                            <option value="6. አדרስ ማርያም 1st/6. አדרስ ማርያም 1st">6. አדרስ ማርያም 1st</option>
                            <option value="7. መካነ ኢየሱስ ሰ/ደ/1st/7. መካነ ኢየሱስ ሰ/ደ/1st">7. መካነ ኢየሱስ ሰ/ደ/1st</option>
                            <option value="8. ገበያ ማርያም 1st/8. ገበያ ማርያም 1st">8. ገበያ ማርያም 1st</option>
                            <option value="9. አምባር 01 1st/9. አምባር 01 1st">9. አምባር 01 1st</option>
                            <option value="10. የጉራር 09/10. የጉራር 09">10. የጉራር 09</option>
                            <option value="11. ትብርራ 08 1st/11. ትብርራ 08 1st">11. ትብርራ 08 1st</option>
                            <option value="12. 6ማርያም 12/12. 6ማርያም 12">12. 6ማርያም 12</option>
                            <option value="13. ዉጫሌ 01 1st/13. ዉጫሌ 01 1st">13. ዉጫሌ 01 1st</option>
                            <option value="14. ኬርኒ 07/14. ኬርኒ 07">14. ኬርኒ 07</option>
                            <option value="15. አድስአለም 02 አትክልትማ 1st/15. አድስአለም 02 አትክልትማ 1st">15. አድስአለም 02 አትክልትማ 1st</option>
                            <option value="16. ከገማ 03/16. ከገማ 03">16. ከገማ 03</option>
                            <option value="17. አጋም ወንዝ 1st/17. አጋም ወንዝ 1st">17. አጋም ወንዝ 1st</option>
                            <option value="18. ሰዴ 04 1st/18. ሰዴ 04 1st">18. ሰዴ 04 1st</option>
                            <option value="19. አኬ 19/19. አኬ 19">19. አኬ 19</option>
                            <option value="20. ሃምለች 20/20. ሃምለች 20">20. ሃምለች 20</option>
                            <option value="21. ዶ/ር አበበ 21/21. ዶ/ር አበበ 21">21. ዶ/ር አበበ 21</option>
                            <option value="22. አርአያ 22/22. አርአያ 22">22. አርአያ 22</option>
                            <option value="23. ሸዋ በር 23/23. ሸዋ በር 23">23. ሸዋ በር 23</option>
                            <option value="24. ጎልጎታ 24/24. ጎልጎታ 24">24. ጎልጎታ 24</option>
                            <option value="25. ሰለላ 25/25. ሰለላ 25">25. ሰለላ 25</option>
                            <option value="26. ጐቁቄ 26/26. ጐቁቄ 26">26. ጐቁቄ 26</option>
                            <option value="27. በጅገራ ከተማ/27. በጅገራ ከተማ">27. በጅገራ ከተማ</option>
                            <option value="28. ደብረ ሲና ማርያም 28/28. ደብረ ሲና ማርያም 28">28. ደብረ ሲና ማርያም 28</option>
                            <option value="29. ከልየ ስራ በጎነፍል 29/29. ከልየ ስራ በጎነፍል 29">29. ከልየ ስራ በጎነፍል 29</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">የዕለቱ የሥራ አፈጻጸም ማጠቃለያ ማስታወሻ</label>
                        <textarea id="reportText" rows="4" required class="w-full p-2.5 text-sm border rounded-lg focus:ring-1 focus:ring-blue-500" placeholder="ቀን ቀን የተከናወኑ ስራዎችን በአጭሩ ይጻፉ..."></textarea>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">የሪፖርት ሰነድ ፋይል አያይዝ (PDF ወይም Word)</label>
                        <input type="file" id="reportFile" accept=".pdf,.doc,.docx" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">የላኩበት ሰዓት</label>
                        <select id="reportTimeSlot" required class="w-full p-2.5 text-sm border rounded-lg bg-slate-50">
                            <option value="ከሰዓት 06:30 - 08:00">ከሰዓት 06:30 - 08:00 (መደበኛ ሰዓት)</option>
                            <option value="ከዚህ ውጪ (ዘግይቶ የተላከ)">ከዚህ ውጪ (ዘግይቶ የተላከ)</option>
                        </select>
                    </div>

                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg text-sm shadow-md transition">
                        ሪፖርት እና ፋይል ልክ
                    </button>
                </form>
            </div>

            <!-- 2. Admin View (Protected) -->
            <div id="view-admin" class="hidden space-y-4">
                <div class="bg-amber-50 p-3 rounded-lg flex justify-between items-center">
                    <div>
                        <h2 class="font-bold text-sm text-amber-800">የአድሚን መቆጣጠሪያ ፓነል</h2>
                        <p class="text-xs text-amber-600">የተቋማትን ሪፖርቶች መከታተያ</p>
                    </div>
                    <button onclick="logoutAdmin()" class="bg-red-500 text-white text-xs px-3 py-1.5 rounded-lg shadow">ውጣ</button>
                </div>

                <div class="flex justify-between items-center">
                    <span id="reportCount" class="text-xs font-bold text-slate-600">ቀረበ: 0 ሪፖርቶች</span>
                    <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-2 rounded-lg font-semibold shadow">
                        📊 ወደ Excel አውርድ
                    </button>
                </div>

                <div id="adminReportsList" class="space-y-3 max-h-[60vh] overflow-y-auto">
                    <p class="text-center text-xs text-slate-400 py-6">ምንም ሪፖርት አልገባም</p>
                </div>
            </div>

        </main>

        <!-- Footer -->
        <footer class="bg-slate-100 p-3 text-center text-xs text-slate-500 border-t mt-auto">
            የቢቡኝ ወረዳ የፖለቲካ እና አቅም ግንባታ ፅ/ቤት © 2019 ዓ.ም
        </footer>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCmuA0TiYr9MegsGlglEOP2D5jLnKYQPg",
            authDomain: "beki-report.firebaseapp.com",
            projectId: "beki-report",
            storageBucket: "beki-report.firebasestorage.app",
            messagingSenderId: "268458229018",
            appId: "1:268458229018:web:41267c7fd277aefdd340a3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.submitReport = async function(event) {
            event.preventDefault();
            const btn = event.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.textContent = " በመላክ ላይ...";

            try {
                const fileInput = document.getElementById('reportFile');
                let fileData = "";
                let fileName = "";

                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    fileName = file.name;
                    fileData = await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = (e) => resolve(e.target.result);
                        reader.readAsDataURL(file);
                    });
                }

                await addDoc(collection(db, "reports"), {
                    institution: document.getElementById('instName').value,
                    text: document.getElementById('reportText').value,
                    timeSlot: document.getElementById('reportTimeSlot').value,
                    fileName: fileName,
                    fileData: fileData,
                    timestamp: new Date().toISOString()
                });

                alert("ሪፖርቱ በትክክል ተልኳል!");
                document.getElementById('reportForm').reset();
            } catch (error) {
                alert("ተልኮ አልተሳካም: " + error.message);
            } finally {
                btn.disabled = false;
                btn.textContent = "ሪፖርት እና ፋይል ልክ";
            }
        }

        window.loadAdminReports = async function() {
            const listContainer = document.getElementById('adminReportsList');
            listContainer.innerHTML = '<p class="text-center text-xs text-slate-400 py-6">ሪፖርቶች በመጫን ላይ...</p>';

            try {
                const q = query(collection(db, "reports"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);
                
                listContainer.innerHTML = '';
                let count = 0;

                querySnapshot.forEach((docSnap) => {
                    count++;
                    const data = docSnap.data();
                    const dateStr = new Date(data.timestamp).toLocaleString();

                    let fileSection = '';
                    if (data.fileData) {
                        fileSection = `<a href="${data.fileData}" download="${data.fileName}" class="inline-block mt-2 bg-blue-50 text-blue-700 text-xs px-3 py-1 rounded font-semibold border border-blue-200">📥 ፋይል አውርድ (${data.fileName})</a>`;
                    }

                    const card = document.createElement('div');
                    card.className = "bg-white p-3 rounded-lg border shadow-sm text-xs space-y-1";
                    card.innerHTML = `
                        <div class="flex justify-between font-bold text-blue-900">
                            <span>${data.institution}</span>
                            <span
