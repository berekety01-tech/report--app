<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የወረዳ የሥራ አፈጻጸም ሪፖርት ማቀበያ ስርዓት</title>
    <!-- Tailwind CSS for modern design -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800">

    <div class="max-w-md mx-auto min-h-screen bg-white shadow-xl flex flex-col">
        <!-- Header -->
        <header class="bg-blue-900 text-white p-4 text-center shadow-md">
            <h1 class="text-lg font-bold">የምስራቅ ጎጃም ዞን / ቢቡኝ ወረዳ</h1>
            <p class="text-xs text-blue-200 mt-1">የፖለቲካ እና አቅም ግንባታ ዘርፍ ፅ/ቤት</p>
        </header>

        <!-- Main Content Area -->
        <main class="p-4 flex-1">
            
            <!-- Tab Switcher -->
            <div class="flex border-b mb-4 text-sm font-medium">
                <button onclick="switchTab('institution')" id="btn-institution" class="flex-1 py-2 text-center border-b-2 border-blue-600 text-blue-600 font-medium">ለተቋማት (ሪፖርት መላኪያ)</button>
                <button onclick="requestAdminAccess()" id="btn-admin" class="flex-1 py-2 text-center text-slate-500 font-medium">ለአድሚን (መቆጣጠሪያ)</button>
            </div>

            <!-- 1. Institution Form View -->
            <div id="view-institution" class="space-y-4">
                <div class="bg-blue-50 p-3 rounded-lg text-xs text-blue-800">
                    <p class="font-bold">⚠️ የሪፖርት ማቅረቢያ ሰዓት:</p>
                    <p>ከሰዓት በኋላ ከ<b>06:30 እስከ 08:00</b> ሰዓት ብቻ ነው። ከዚህ ውጪ የሚላኩ ሪፖርቶች ዘግይተዋል ተብሎ ይመዝገባሉ።</p>
                </div>

                <form id="reportForm" onsubmit="submitReport(event)" class="space-y-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">ተቋም ይምረጡ (29 ተቋማት)</label>
                        <select id="instName" required class="w-full p-2.5 text-sm border rounded-lg focus:ring-2 focus:ring-blue-500 bg-white">
                            <option value="">-- ተቋም ይምረጡ --</option>
                            <option value="1. እንስሳት እና አሳ ሀብት ፅ/ቤት">1. እንስሳት እና አሳ ሀብት ፅ/ቤት</option>
                            <option value="2. ግብርና ፅ/ቤት">2. ግብርና ፅ/ቤት</option>
                            <option value="3. መንገድ፣ ትራንስፖርት እና ሎጀስቲክ ፅ/ቤት">3. መንገድ፣ ትራንስፖርት እና ሎጀስቲክ ፅ/ቤት</option>
                            <option value="4. ውሃና ኢነርጅ ልማት ፅ/ቤት">4. ውሃና ኢነርጅ ልማት ፅ/ቤት</option>
                            <option value="5. መሬት ፅ/ቤት">5. መሬት ፅ/ቤት</option>
                            <option value="6. አካባቢ ጥበቃ ተ/ ፅ/ቤት">6. አካባቢ ጥበቃ ተ/ ፅ/ቤት</option>
                            <option value="7. ድጎ ፅዮን መሪ ማዘጋጃ ቤት">7. ድጎ ፅዮን መሪ ማዘጋጃ ቤት</option>
                            <option value="8. አስተዳደር ፅ/ቤት">8. አስተዳደር ፅ/ቤት</option>
                            <option value="9. ፕላንና ልማት ፅ/ቤት">9. ፕላንና ልማት ፅ/ቤት</option>
                            <option value="10. ሰላምና ፀጥታ ፅ/ቤት">10. ሰላምና ፀጥታ ፅ/ቤት</option>
                            <option value="11. ምክር ቤት ፅ/ቤት">11. ምክር ቤት ፅ/ቤት</option>
                            <option value="12. ፍትህ ፅ/ቤት">12. ፍትህ ፅ/ቤት</option>
                            <option value="13. ሴ/ህ/ወ/ማ/ ፅ/ቤት">13. ሴ/ህ/ወ/ማ/ ፅ/ቤት</option>
                            <option value="14. ሚሊሻ ፅ/ቤት">14. ሚሊሻ ፅ/ቤት</option>
                            <option value="15. ኢንዱስትሪ እና ኢንቨስትመንት ፅ/ቤት">15. ኢንዱስትሪ እና ኢንቨስትመንት ፅ/ቤት</option>
                            <option value="16. ከተማ ልማት ፅ/ቤት">16. ከተማ ልማት ፅ/ቤት</option>
                            <option value="17. ኢንስፔክሽን እና ስነ ምግባር ኮሚሽን">17. ኢንስፔክሽን እና ስነ ምግባር ኮሚሽን</option>
                            <option value="18. ወጣት ክንፍ">18. ወጣት ክንፍ</option>
                            <option value="19. ሴት ክንፍ">19. ሴት ክንፍ</option>
                            <option value="20. ትምህርት ፅ/ቤት">20. ትምህርት ፅ/ቤት</option>
                            <option value="21. ጤና ፅ/ቤት">21. ጤና ፅ/ቤት</option>
                            <option value="22. ሲቪል ሰርቪስ ፅ/ቤት">22. ሲቪል ሰርቪስ ፅ/ቤት</option>
                            <option value="23. ባህል፣ ቱሪዝምና ስፖርት ፅ/ቤት">23. ባህል፣ ቱሪዝምና ስፖርት ፅ/ቤት</option>
                            <option value="24. ገንዘብ ፅ/ቤት">24. ገንዘብ ፅ/ቤት</option>
                            <option value="25. ስራና ክህሎት ፅ/ቤት">25. ስራና ክህሎት ፅ/ቤት</option>
                            <option value="26. ገቢዎች ፅ/ቤት">26. ገቢዎች ፅ/ቤት</option>
                            <option value="27. የመንግስት ኮሚኒኬሽን ፅ/ቤት">27. የመንግስት ኮሚኒኬሽን ፅ/ቤት</option>
                            <option value="28. ንግድና ገቢያ ልማት ፅ/ቤት">28. ንግድና ገቢያ ልማት ፅ/ቤት</option>
                            <option value="29. ህብረት ስራ ማህበራት ተ/ፅ/ቤት">29. ህብረት ስራ ማህበራት ተ/ፅ/ቤት</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">የዕለቱ የሥራ አፈጻጸም ማጠቃለያ ማስታወሻ</label>
                        <textarea id="reportText" required rows="3" class="w-full p-2.5 text-sm border rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="ዋና ዋና የተከናወኑ ስራዎችን በአጭሩ ይጻፉ..."></textarea>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">የሪፖርት ሰነድ ፋይል አባሪ (PDF ወይም Word)</label>
                        <input type="file" id="reportFile" accept=".pdf,.doc,.docx" required class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 border rounded-lg p-1">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">የላኩበት ሰዓት</label>
                        <input type="time" id="reportTime" required class="w-full p-2.5 text-sm border rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>

                    <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg text-sm transition">
                        ሪፖርት እና ፋይል ላክ
                    </button>
                </form>

                <div id="feedbackBox" class="hidden p-3 rounded-lg text-sm mt-3"></div>
            </div>

            <!-- 2. Admin View (Password Protected) -->
            <div id="view-admin" class="hidden space-y-4">
                <div class="flex justify-between items-center bg-slate-100 p-3 rounded-lg">
                    <div>
                        <h2 class="text-xs font-bold text-slate-700">የአድሚን መቆጣጠሪያ ፓነል</h2>
                        <p class="text-[10px] text-slate-500">የተላኩ ሪፖርቶች እና ፋይሎች ማጠቃለያ (29 ተቋማት)</p>
                    </div>
                    <button onclick="exportToCSV()" class="bg-green-600 text-white text-xs px-3 py-1.5 rounded font-medium">📥 ኤክሴል አውርድ</button>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs border-collapse">
                        <thead>
                            <tr class="bg-slate-200 text-slate-700">
                                <th class="p-2 border">ተቋም</th>
                                <th class="p-2 border">ሰዓት</th>
                                <th class="p-2 border">ሁኔታ</th>
                                <th class="p-2 border">ፋይል / ጽሁፍ</th>
                            </tr>
                        </thead>
                        <tbody id="adminTableBody">
                            <tr><td colspan="4" class="p-4 text-center text-slate-400">መረጃዎች በመጫን ላይ...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>

        <!-- Footer -->
        <footer class="bg-slate-100 text-center py-3 text-[10px] text-slate-500 border-t">
            የቢቡኝ ወረዳ ፖለቲካ እና አቅም ግንባታ ዘርፍ © 2019 ዓ.ም
        </footer>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyOmADtIYy9HMegvGlqEOP2DSjLynKVQpG",
            authDomain: "beki-report.firebaseapp.com",
            projectId: "beki-report",
            storageBucket: "beki-report.firebasestorage.app",
            messagingSenderId: "268458229018",
            appId: "1:268458229018:web:61287cfd277aefad3d00a3"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Auto-set current time in time input
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('reportTime').value = `${hours}:${minutes}`;

        // Admin Password Verification (marshet0458)
        window.requestAdminAccess = function() {
            let pass = prompt("እባክዎ የአድሚን ሚስጥራዊ ቁጥር (Password) ያስገቡ:");
            if (pass === "marshet0458") {
                window.switchTab('admin');
            } else if (pass !== null) {
                alert("የገባው ሚስጥራዊ ቃል ስህተት ነው!");
            }
        }

        // Tab switching logic
        window.switchTab = function(tab) {
            if (tab === 'institution') {
                document.getElementById('view-institution').classList.remove('hidden');
                document.getElementById('view-admin').classList.add('hidden');
                document.getElementById('btn-institution').className = "flex-1 py-2 text-center border-b-2 border-blue-600 text-blue-600 font-medium";
                document.getElementById('btn-admin').className = "flex-1 py-2 text-center text-slate-500 font-medium";
            } else {
                document.getElementById('view-institution').classList.add('hidden');
                document.getElementById('view-admin').classList.remove('hidden');
                document.getElementById('btn-admin').className = "flex-1 py-2 text-center border-b-2 border-blue-600 text-blue-600 font-medium";
                document.getElementById('btn-institution').className = "flex-1 py-2 text-center text-slate-500 font-medium";
                loadAdminData();
            }
        }

        // Handle Report Submission to Firebase Cloud
        window.submitReport = async function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = " በመላክ ላይ...",

            const instName = document.getElementById('instName').value;
            const reportText = document.getElementById('reportText').value;
            const reportTime = document.getElementById('reportTime').value;
            const fileInput = document.getElementById('reportFile');
            const fileName = fileInput.files.length > 0 ? fileInput.files[0].name : 'ፋይል የለም';

            let [h, m] = reportTime.split(':').map(Number);
            let totalMinutes = h * 60 + m;
            let isOntime = (totalMinutes >= 750 && totalMinutes <= 840); // 12:30 እስከ 14:00

            let status = isOntime ? 'on-time' : 'late';
            let feedbackBox = document.getElementById('feedbackBox');
            feedbackBox.classList.remove('hidden');

            try {
                // Save to Firestore Cloud Database
                await addDoc(collection(db, "bibugnReports"), {
                    instName: instName,
                    reportText: reportText,
                    fileName: fileName,
                    reportTime: reportTime,
                    status: status,
                    timestamp: new Date()
                });

                if (isOntime) {
                    feedbackBox.className = "p-3 rounded-lg text-sm mt-3 bg-green-100 text-green-800 border border-green-200";
                    feedbackBox.innerHTML = "✅ <b>እናመሰግናለን!</b> ሪፖርቱ እና ፋይሉ በሰዓቱ ተልከዋል እንዲሁም በቀጥታ ወደ አድሚን ዳታቤዝ ደርሰዋል።";
                } else {
                    feedbackBox.className = "p-3 rounded-lg text-sm mt-3 bg-yellow-100 text-yellow-800 border border-yellow-200";
                    feedbackBox.innerHTML = "⚠️ <b>ማስጠንቀቂያ!</b> ሪፖርቱ ተልኳል ነገር ግን <b>ዘግይቶ</b> ስለተላከ በሰዓቱ እንዳልደረሰ ተመዝግቧል።";
                }

                document.getElementById('reportForm').reset();
            } catch (error) {
                console.error("Error adding document: ", error);
                feedbackBox.className = "p-3 rounded-lg text-sm mt-3 bg-red-100 text-red-800 border border-red-200";
                feedbackBox.innerHTML = "❌ <b>ስህተት ተፈጥሯል!</b> እባክዎ እንደገና ይሞክሩ።";
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "ሪፖርት እና ፋይል ላክ";
            }
        }

        // Load Admin Data from Firebase Cloud
        async function loadAdminData() {
            let tbody = document.getElementById('adminTableBody');
            tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-400">መረጃዎች ከሰርቨር በመጫን ላይ...</td></tr>`;
            
            try {
                const querySnapshot = await getDocs(collection(db, "bibugnReports"));
                tbody.innerHTML = '';
                
                if (querySnapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-400">እስከ አሁን የተላከ ሪፖርት የለም</td></tr>`;
                    return;
                }

                querySnapshot.forEach((doc) => {
                    let rep = doc.data();
                    let tr = document.createElement('tr');
                    tr.className = "border-b";
                    tr.innerHTML = `
                        <td class="p-2 border font-medium">${rep.instName}</td>
                        <td class="p-2 border">${rep.reportTime}</td>
                        <td class="p-2 border text-center">${rep.status === 'on-time' ? '🟢 በሰዓቱ' : '⚠️ ዘግይቷል'}</td>
                        <td class="p-2 border text-slate-600 text-[11px]">
                            <b>ፋይል:</b> ${rep.fileName}<br>
                            <span class="text-slate-500">${rep.reportText ? rep.reportText.substring(0, 30) : ''}...</span>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error("Error loading data: ", error);
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-red-500">መረጃዎችን መጫን አልተቻለም።</td></tr>`;
            }
        }

        // Export to CSV
        window.exportToCSV = async function() {
            try {
                const querySnapshot = await getDocs(collection(db, "bibugnReports"));
                if (querySnapshot.empty) {
                    alert("ማውረድ የሚችሏቸው መረጃዎች የሉም!");
                    return;
                }

                let csvContent = "data:text/csv;charset=utf-8,ተቋም,ሰዓት,ሁኔታ,ፋይል ስም,ማስታወሻ\n";
                querySnapshot.forEach((doc) => {
                    let r = doc.data();
                    csvContent += `"${r.instName}","${r.reportTime}","${r.status === 'on-time' ? 'በሰዓቱ' : 'ዘግይቷል'}","${r.fileName}","${r.reportText}"\n`;
                });

                let encodedUri = encodeURI(csvContent);
                let link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", "Bibugn_29_Institutions_Reports.csv");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } catch (error) {
                alert("ኤክሴል ማውረድ አልተቻለም!");
            }
        }
    </script>
</body>
