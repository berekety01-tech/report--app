<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የስራ አፈፃፀም ሪፖርት ማቀበያ አፕ</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-y-screen p-4">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6 mt-4">
        <h1 class="text-xl font-bold text-center text-blue-600 mb-4">የስራ አፈፃፀም ሪፖርት ማቀበያ</h1>
        
        <div id="auth-section" class="mb-4 p-3 bg-gray-50 rounded">
            <h2 class="font-semibold mb-2">ግባ (Login)</h2>
            <input type="email" id="email" placeholder="ኢሜይል (ለአድሚን)" class="w-full p-2 mb-2 border rounded">
            <input type="password" id="password" placeholder="የይለፍ ቃል" class="w-full p-2 mb-2 border rounded">
            <button onclick="adminLogin()" class="w-full bg-blue-600 text-white p-2 rounded mb-2">እንደ አድሚን ግባ</button>
            <button onclick="anonLogin()" class="w-full bg-green-600 text-white p-2 rounded">ያለ አካውንት (እንደ ተጠቃሚ) ግባ</button>
        </div>

        <div id="user-info" class="hidden mb-4 p-2 bg-green-100 rounded flex justify-between items-center">
            <span id="user-status" class="text-sm"></span>
            <button onclick="logout()" class="bg-red-500 text-white px-2 py-1 rounded text-sm">ውጣ</button>
        </div>

        <div id="report-form" class="hidden mb-4 p-3 bg-blue-50 rounded">
            <h2 class="font-semibold mb-2">አዲስ ሪፖርት አስገባ</h2>
            <input type="text" id="dept" placeholder="የስራ ክፍል / ጽ/ቤት ስም" class="w-full p-2 mb-2 border rounded">
            <textarea id="repText" placeholder="የሪፖርቱ ዝርዝር..." class="w-full p-2 mb-2 border rounded" rows="3"></textarea>
            <button onclick="sendReport()" class="w-full bg-indigo-600 text-white p-2 rounded">ሪፖርት ላክ</button>
        </div>

        <div>
            <h2 class="font-semibold mb-2">የተላኩ ሪፖርቶች</h2>
            <div id="reports-list" class="space-y-2"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signInAnonymously, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCMuAOtiYz9hMmgsDlqE0P2DSjlywKVQPg",
            authDomain: "beki-report.firebaseapp.com",
            projectId: "beki-report",
            storageBucket: "beki-report.firebasestorage.app",
            messagingSenderId: "268458229018",
            appId: "1:268458229018:web:72f98be9a36af3423d80a3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let isAdmin = false;

        window.adminLogin = async () => {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            try {
                await signInWithEmailAndPassword(auth, e, p);
            } catch(err) { alert('ግንኙነት አልተሳካም: ' + err.message); }
        };

        window.anonLogin = async () => {
            try {
                await signInAnonymously(auth);
            } catch(err) { alert('ስህተት ተፈጥሯል'); }
        };

        window.logout = () => signOut(auth);

        window.sendReport = async () => {
            const dept = document.getElementById('dept').value;
            const text = document.getElementById('repText').value;
            if(!dept || !text) { alert('እባክዎ ሁሉንም ቦታዎች ይሙሉ'); return; }
            try {
                await addDoc(collection(db, 'reports'), {
                    department: dept,
                    reportText: text,
                    createdAt: serverTimestamp(),
                    sender: isAdmin ? 'Admin' : 'Anonymous User'
                });
                document.getElementById('dept').value = '';
                document.getElementById('repText').value = '';
                alert('ሪፖርቱ ተልኳል!');
                loadReports();
            } catch(err) { alert('መላክ አልተቻለም'); }
        };

        window.deleteRep = async (id) => {
            if(confirm('ማጥፋት ይፈልጋሉ?')) {
                await deleteDoc(doc(db, 'reports', id));
                loadReports();
            }
        };

        async function loadReports() {
            const listDiv = document.getElementById('reports-list');
            listDiv.innerHTML = 'በመጫን ላይ...';
            try {
                const querySnapshot = await getDocs(collection(db, 'reports'));
                listDiv.innerHTML = '';
                querySnapshot.forEach((d) => {
                    const data = d.data();
                    listDiv.innerHTML += `
                        <div class="p-3 bg-gray-50 border rounded text-sm">
                            <strong>ክፍል: ${data.department}</strong>
                            <p>${data.reportText}</p>
                            <small class="text-gray-500">ላኪ: ${data.sender}</small>
                            ${isAdmin ? `<button onclick="deleteRep('${d.id}')" class="mt-2 block bg-red-600 text-white px-2 py-1 rounded text-xs">አጥፋ</button>` : ''}
                        </div>
                    `;
                });
                if(querySnapshot.empty) listDiv.innerHTML = '<p class="text-gray-500">ምንም ሪፖርት የለም</p>';
            } catch(err) { listDiv.innerHTML = 'ማምጣት አልተቻለም'; }
        }

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if(user) {
                isAdmin = user.email ? true : false;
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('user-info').classList.remove('hidden');
                document.getElementById('report-form').classList.remove('hidden');
                document.getElementById('user-status').innerText = `ገብቷል: ${user.email || 'ተጠቃሚ (Anonymous)'}`;
            } else {
                isAdmin = false;
                document.getElementById('auth-section').classList.remove('hidden');
                document.getElementById('user-info').classList.add('hidden');
                document.getElementById('report-form').classList.add('hidden');
            }
            loadReports();
        });
    </script>
</body>
</html>
